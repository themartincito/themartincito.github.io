<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mi rincón</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#a4d488; --panel:#ffffff; --panel-2:#f3f5fb; --ink:#141a2e; --ink-2:#5b6278; --line:#e3e6ef;
  --brand:#4a5cf0; --brand-ink:#ffffff; --brand-soft:#eceeff; --shadow:0 12px 36px rgba(20,28,70,.16);
  --glass:rgba(255,255,255,.9);
  color-scheme:light;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1d2e20; --panel:#181c2c; --panel-2:#222842; --ink:#eef0f8; --ink-2:#a6acc3; --line:#2e3453;
    --brand:#6e7dff; --brand-ink:#ffffff; --brand-soft:#262c55; --shadow:0 12px 36px rgba(0,0,0,.5); --glass:rgba(24,28,44,.9);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1d2e20; --panel:#181c2c; --panel-2:#222842; --ink:#eef0f8; --ink-2:#a6acc3; --line:#2e3453;
  --brand:#6e7dff; --brand-ink:#ffffff; --brand-soft:#262c55; --shadow:0 12px 36px rgba(0,0,0,.5); --glass:rgba(24,28,44,.9);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:'Onest',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
#app{position:relative;width:100%;height:100%;overflow:hidden}
canvas{display:block;width:100%;height:100%;touch-action:none;outline:none}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
[hidden]{display:none!important}

/* top bar */
.top{position:absolute;left:16px;right:16px;top:16px;display:flex;align-items:center;gap:12px;pointer-events:none}
.top>*{pointer-events:auto}
.brandmark{display:flex;align-items:center;gap:10px;background:var(--glass);backdrop-filter:blur(10px);border-radius:16px;padding:8px 14px 8px 8px;box-shadow:var(--shadow);text-decoration:none;color:var(--ink);border:0}
.brandmark .logo{width:32px;height:32px;border-radius:10px;background:var(--brand);display:grid;place-items:center}
.brandmark .logo svg{width:18px;height:18px}
.brandmark b{font-weight:700;font-size:17px;letter-spacing:-.01em;white-space:nowrap}
.brandmark span{color:var(--brand);font-weight:600;font-size:17px}
nav.rooms{display:flex;gap:4px;background:var(--glass);backdrop-filter:blur(10px);border-radius:16px;padding:5px;box-shadow:var(--shadow);margin:0 auto;overflow-x:auto;scrollbar-width:none}
nav.rooms::-webkit-scrollbar{display:none}
nav.rooms button{border:0;background:transparent;border-radius:11px;padding:8px 13px;font-weight:500;font-size:14px;white-space:nowrap;display:flex;align-items:center;gap:7px}
nav.rooms button:hover{background:var(--panel-2)}
nav.rooms button[aria-current="true"]{background:var(--brand-soft);color:var(--ink)}
.cta{border:0;background:var(--brand);color:var(--brand-ink);border-radius:14px;padding:11px 18px;font-weight:600;box-shadow:var(--shadow);white-space:nowrap}

.themebtn{width:46px;height:46px;border:0;border-radius:14px;background:var(--glass);backdrop-filter:blur(10px);box-shadow:var(--shadow);display:grid;place-items:center;flex:none}
.themebtn svg{width:20px;height:20px;stroke:var(--ink);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.themebtn .sun{display:none}
:root[data-theme="dark"] .themebtn .sun{display:block}
:root[data-theme="dark"] .themebtn .moon{display:none}

/* hero */
.hero{position:absolute;left:24px;bottom:24px;max-width:430px;background:var(--glass);backdrop-filter:blur(10px);border-radius:22px;padding:24px 26px;box-shadow:var(--shadow);transition:opacity .35s,transform .35s}
.hero h1{font-size:34px;line-height:1.05;letter-spacing:-.035em;margin:0 0 10px;font-weight:800}
.hero p{margin:0;color:var(--ink-2)}
.hero .hint{margin-top:14px;font-size:13px;color:var(--ink-2);display:flex;gap:8px;align-items:center}
.hero .hint i{width:8px;height:8px;border-radius:50%;background:#2fb36b;box-shadow:0 0 0 4px rgba(47,179,107,.2);flex:none}
body.room-open .hero{opacity:0;transform:translateY(12px);pointer-events:none}

/* room tags & bubbles */
#tags,#bubbles{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.tag{position:absolute;left:0;top:0;pointer-events:auto;border:0;background:var(--glass);backdrop-filter:blur(8px);color:var(--ink);border-radius:999px;padding:7px 14px 7px 9px;
  font-weight:600;font-size:13.5px;box-shadow:0 6px 18px rgba(20,28,70,.18);display:flex;align-items:center;gap:7px;white-space:nowrap;transition:background .15s,color .15s,opacity .3s}
.tag .ic{width:24px;height:24px;border-radius:50%;background:var(--brand-soft);display:grid;place-items:center;font-size:13px}
.tag small{font-weight:500;color:var(--ink-2);font-size:12.5px}
.tag.hot{background:var(--brand);color:var(--brand-ink)}
.tag.hot small{color:rgba(255,255,255,.85)}
.tag.hot .ic{background:rgba(255,255,255,.2)}
body.room-open .tag{opacity:0;pointer-events:none}
.bub{position:absolute;left:0;top:0;font-size:14px;line-height:1;background:var(--panel);border-radius:10px;padding:4px 5px;box-shadow:0 3px 10px rgba(0,0,0,.15)}

/* panel */
#panel{position:absolute;right:16px;top:84px;bottom:16px;width:420px;background:var(--panel);border-radius:22px;box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden;animation:pin .35s ease}
@keyframes pin{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){#panel{animation:none}.hero{transition:none}}
.p-head{padding:18px 20px 14px;border-bottom:1px solid var(--line)}
.back{border:0;background:transparent;color:var(--ink-2);padding:4px 6px 4px 0;font-size:13.5px;font-weight:500;display:inline-flex;gap:6px;align-items:center;margin-bottom:10px}
.back svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.back:hover{color:var(--ink)}
.p-title{display:flex;gap:12px;align-items:center}
.p-title .ic{width:44px;height:44px;border-radius:14px;background:var(--brand-soft);display:grid;place-items:center;font-size:22px;flex:none}
.p-title h2{margin:0;font-size:24px;letter-spacing:-.025em;line-height:1.1}
.p-title p{margin:2px 0 0;color:var(--ink-2);font-size:14px}
#pBody{flex:1;overflow:auto;padding:16px 20px 20px}
.note{font-size:12px;color:var(--ink-2);margin:16px 0 0}
.item{display:flex;gap:14px;padding:12px;border-radius:14px;border:1px solid var(--line);background:var(--panel);text-align:left;width:100%;margin-bottom:10px;align-items:flex-start}
button.item:hover{border-color:var(--brand)}
.item .meta{font-size:12.5px;color:var(--ink-2);margin-top:3px}
.item b{font-weight:600;display:block;line-height:1.3}
.pill{display:inline-block;font-size:11.5px;font-weight:600;background:var(--brand-soft);color:var(--ink);padding:2px 8px;border-radius:99px;margin-bottom:4px}
.thumb{width:112px;flex:none;aspect-ratio:16/9;border-radius:10px;position:relative;display:grid;place-items:center;color:#fff}
.thumb .play{width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.92);display:grid;place-items:center}
.thumb .play svg{width:12px;height:12px;fill:#141a2e;margin-left:2px}
.thumb em{position:absolute;right:6px;bottom:5px;font-style:normal;font-size:11px;font-weight:600;background:rgba(0,0,0,.55);padding:1px 5px;border-radius:5px}
.player{aspect-ratio:16/9;border-radius:16px;background:#0f1222;display:grid;place-items:center;color:#c9cdf0;margin-bottom:14px;position:relative;overflow:hidden}
.player .play{width:58px;height:58px;border-radius:50%;background:#fff;display:grid;place-items:center}
.player .play svg{width:20px;height:20px;fill:#141a2e;margin-left:3px}
.player span{position:absolute;bottom:12px;left:14px;font-size:12.5px}
.date{width:54px;flex:none;border-radius:12px;background:var(--brand-soft);text-align:center;padding:6px 0}
.date b{font-size:20px;line-height:1.1}
.date span{font-size:11.5px;color:var(--ink-2);display:block}
.small-btn{margin-top:8px;border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:6px 12px;font-weight:600;font-size:13px}
.small-btn:hover{border-color:var(--brand)}
article.reader h3{font-size:22px;letter-spacing:-.02em;line-height:1.2;margin:4px 0 10px}
article.reader p{margin:0 0 12px;color:var(--ink);max-width:62ch}
article.reader p.meta{color:var(--ink-2);font-size:13px;margin:-4px 0 12px}
article.reader .media a{display:block}
.field{display:block;margin-bottom:12px}
.field span{display:block;font-size:13px;font-weight:500;margin-bottom:5px}
.field input{width:100%;border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:11px 12px}
.big-btn{width:100%;border:0;background:var(--brand);color:var(--brand-ink);border-radius:12px;padding:12px;font-weight:600}
#toast{position:absolute;left:50%;top:84px;transform:translateX(-50%);background:var(--ink);color:var(--panel);border-radius:999px;padding:9px 16px;font-size:13.5px;font-weight:500;opacity:0;transition:opacity .2s;pointer-events:none;max-width:calc(100% - 32px);text-align:center;z-index:5}
#toast.show{opacity:1}

@media (max-width:760px){
  .top{flex-wrap:wrap;gap:8px}
  .brandmark{order:1}
  .cta{order:2;margin-left:auto;padding:10px 14px}
  .themebtn{order:2;margin-left:auto;width:42px;height:42px}
  .themebtn + .cta{margin-left:0}
  nav.rooms{order:3;width:100%;margin:0}
  .hero{left:12px;right:12px;bottom:12px;max-width:none;padding:18px}
  .hero h1{font-size:26px}
  #panel{left:0;right:0;bottom:0;top:auto;height:58%;width:auto;border-radius:22px 22px 0 0;animation:pup .35s ease}
  @keyframes pup{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
  .tag small{display:none}
}

/* ---------- tu contenido dentro de las salas ---------- */
.brandmark.solo-icono{padding:8px}
.temas{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.temas button{border:1px solid var(--line);background:var(--panel);border-radius:99px;padding:4px 11px;font-size:12.5px;font-weight:500}
.temas button[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.thumb{background:var(--panel-2) center/cover no-repeat;overflow:hidden}
.thumb.texto{background:var(--brand-soft);color:var(--ink);font-size:22px}
.item .resumen{font-size:13px;color:var(--ink-2);margin-top:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.vacio{color:var(--ink-2);text-align:center;padding:30px 10px}
.media{border-radius:16px;overflow:hidden;margin-bottom:14px;background:var(--panel-2)}
.media img{display:block;width:100%;height:auto}
.media iframe,.media video{display:block;width:100%;aspect-ratio:16/9;border:0;background:#000}
.acciones{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:12px;padding:9px 14px;font-weight:600;font-size:13.5px;text-decoration:none}
.btn:hover{border-color:var(--brand)}
.btn.principal{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn svg{width:18px;height:18px;flex:none}
.contacto{display:grid;gap:10px;margin-top:16px}
.contacto .btn{justify-content:flex-start;padding:13px 16px;font-size:15px}
.contacto .bandera{border-style:dashed;cursor:default}
.contacto .bandera:hover{border-color:var(--line)}
.sobre{display:flex;gap:14px;align-items:center;margin-bottom:6px}
.sobre .foto{width:72px;height:72px;border-radius:50%;background:var(--panel-2) center/cover no-repeat;flex:none}
.sobre p{margin:0;color:var(--ink-2)}

/* ---------- página propia de cada publicación (?p=id) ---------- */
body.modo-pagina{overflow:auto;height:auto;background:var(--panel)}
body.modo-pagina #app{display:none}
#pagina{max-width:820px;margin:0 auto;padding:20px 16px 60px}
#pagina .volver{display:inline-flex;align-items:center;gap:10px;color:var(--ink);text-decoration:none;font-weight:600;margin-bottom:28px}
#pagina .volver .avatar{width:36px;height:36px;border-radius:50%;background:var(--panel-2) center/cover no-repeat}
#pagina h1{font-size:clamp(28px,5vw,42px);letter-spacing:-.03em;line-height:1.1;margin:6px 0 6px}
#pagina .meta{color:var(--ink-2);margin-bottom:22px}
#pagina article p{font-size:17px;max-width:65ch}
#pagina .media img{max-height:80vh;width:auto;max-width:100%;margin:0 auto}
#pagina nav.vecinos{display:flex;justify-content:space-between;gap:16px;border-top:1px solid var(--line);margin-top:36px;padding-top:20px}
#pagina nav.vecinos a{color:var(--ink-2);text-decoration:none;max-width:45%}
#pagina nav.vecinos a:hover{color:var(--ink)}
#pagina nav.vecinos .sig{margin-left:auto;text-align:right}
</style>
</head>
<body>
<div id="app">
  <canvas id="c" tabindex="-1" aria-hidden="true"></canvas>
  <div id="bubbles" aria-hidden="true"></div>
  <div id="tags"></div>

  <header class="top">
    <button class="brandmark solo-icono" id="home" aria-label="Inicio" title="Inicio">
      <span class="logo" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V9l8-5 8 5v11"/><path d="M10 20v-5h4v5"/></svg></span>
    </button>
    <nav class="rooms" id="nav" aria-label="Salas"></nav>
    <button class="themebtn" id="themeBtn" aria-label="Cambiar a modo noche" title="Cambiar a modo noche">
      <svg class="moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>
      <svg class="sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
    <button class="cta" data-room="recepcion">Contacto</button>
  </header>

  <section class="hero" id="hero">
    <p>Hacé clic en una sala: en la biblioteca están mis textos, en el cine los videos, en la galería las imágenes y en el café los links que vale la pena ver.</p>
    <div class="hint"><i></i><span id="aliveTxt">Hay gente dando vueltas por acá.</span></div>
  </section>

  <aside id="panel" role="dialog" aria-labelledby="pTitle" hidden>
    <div class="p-head">
      <button class="back" id="back"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>Volver a la oficina</button>
      <div class="p-title"><div class="ic" id="pIcon"></div><div><h2 id="pTitle" tabindex="-1"></h2><p id="pSub"></p></div></div>
    </div>
    <div id="pBody"></div>
  </aside>
  <div id="toast" role="status"></div>
</div>
<main id="pagina" hidden></main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/lights/RectAreaLightUniformsLib.js"></script>
<script>
'use strict';
const $ = s => document.querySelector(s);

/* ============ tu contenido: helpers compartidos ============ */
const el = (tag, cls, txt) => { const e = document.createElement(tag); if(cls) e.className = cls; if(txt!=null) e.textContent = txt; return e; };
const ICONO = {texto:'📝', imagen:'🖼️', video:'🎬', link:'🔗'};
function formatearFecha(f){
  if(!f) return '';
  return new Date(f + 'T12:00:00').toLocaleDateString('es-AR', {day:'numeric', month:'long', year:'numeric'});
}
function parrafos(texto){
  return (texto || '').split(/\n\s*\n/).filter(t => t.trim()).map(t => { const p = el('p'); p.innerText = t.trim(); return p; });
}
// aceptan el ID o el link entero ("https://youtu.be/abc", "youtube.com/watch?v=abc", "vimeo.com/123")
function idYoutube(v){ const m = String(v).match(/(?:youtu\.be\/|v=|embed\/|shorts\/)([\w-]{11})/); return m ? m[1] : String(v).trim(); }
function idVimeo(v){ const m = String(v).match(/(\d{6,})/); return m ? m[1] : String(v).trim(); }
function miniatura(item){
  if(item.imagen) return item.imagen;
  if(item.youtube) return `https://img.youtube.com/vi/${idYoutube(item.youtube)}/mqdefault.jpg`;
  return '';
}
const linkPagina = item => '?p=' + encodeURIComponent(item.id);
function dominio(url){ try{ return new URL(url).hostname.replace(/^www\./,''); }catch(e){ return url; } }

// imagen / video / link según el tipo
function armarMedia(item){
  const box = el('div','media');
  if(item.tipo==='video'){
    if(item.youtube){ const f = el('iframe'); f.src = `https://www.youtube-nocookie.com/embed/${idYoutube(item.youtube)}`; f.allow = 'autoplay; encrypted-media; fullscreen; picture-in-picture'; f.allowFullscreen = true; f.title = item.titulo; box.appendChild(f); }
    else if(item.vimeo){ const f = el('iframe'); f.src = `https://player.vimeo.com/video/${idVimeo(item.vimeo)}`; f.allow = 'autoplay; fullscreen; picture-in-picture'; f.allowFullscreen = true; f.title = item.titulo; box.appendChild(f); }
    else if(item.video){ const v = el('video'); v.src = item.video; v.controls = true; v.playsInline = true; box.appendChild(v); }
    else return null;
  } else if(item.imagen){ const i = el('img'); i.src = item.imagen; i.alt = item.titulo; box.appendChild(i); }
  else return null;
  return box;
}
function botonLink(item){
  const a = el('a','btn principal', `Abrir en ${dominio(item.url)} ↗`); a.href = item.url; a.target = '_blank'; a.rel = 'noopener'; return a;
}

/* ============ página propia de una publicación (?p=id) ============ */
function pintarPagina(id){
  document.body.classList.add('modo-pagina');
  const main = $('#pagina'); main.hidden = false;
  const volver = el('a','volver'); volver.href = './';
  const av = el('span','avatar'); av.style.backgroundImage = `url("${PERFIL.foto}")`;
  volver.append(av, el('span', null, '← Volver al inicio'));
  main.appendChild(volver);

  const i = CONTENIDO.findIndex(c => c.id === id), item = CONTENIDO[i];
  if(!item){ main.appendChild(el('p','vacio','Esta publicación no existe.')); return; }
  document.title = `${item.titulo} · ${PERFIL.nombre}`;

  const art = el('article');
  const media = armarMedia(item); if(media) art.appendChild(media);
  art.append(el('h1', null, item.titulo));
  const meta = [ICONO[item.tipo] + ' ' + item.tipo, formatearFecha(item.fecha), ...(item.temas || [])].filter(Boolean).join(' · ');
  art.append(el('div','meta', meta), ...parrafos(item.texto));
  if(item.tipo==='link' && item.url){ const ac = el('div','acciones'); ac.appendChild(botonLink(item)); art.appendChild(ac); }
  main.appendChild(art);

  const nav = el('nav','vecinos'), ant = CONTENIDO[i-1], sig = CONTENIDO[i+1];
  if(ant){ const a = el('a','ant','← ' + ant.titulo); a.href = linkPagina(ant); nav.appendChild(a); }
  if(sig){ const a = el('a','sig', sig.titulo + ' →'); a.href = linkPagina(sig); nav.appendChild(a); }
  main.appendChild(nav);
}

function iniciarOficina(){
const COLS = 26, ROWS = 18, N = COLS*ROWS;
const BRAND = '#4a5cf0';
const idx = (x,z) => z*COLS + x, inB = (x,z) => x>=0 && z>=0 && x<COLS && z<ROWS;
const wx = x => x - COLS/2, wz = z => z - ROWS/2;
const rnd = (a,b) => a + Math.random()*(b-a);
const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const darkMQ = window.matchMedia('(prefers-color-scheme: dark)');

// cada sala muestra un tipo de publicación (el "tipo" de contenido.js)
const ROOMS = [
  {id:'biblioteca', name:'Biblioteca', icon:'📚', sub:'Textos', tipo:'texto', x0:1,z0:1,x1:8,z1:7},
  {id:'cine', name:'Cine', icon:'🎬', sub:'Videos', tipo:'video', x0:10,z0:1,x1:16,z1:7},
  {id:'galeria', name:'Galería', icon:'🖼️', sub:'Imágenes', tipo:'imagen', x0:18,z0:1,x1:24,z1:7},

const GEO = {}, MAT = {};
const geo = (k,f) => GEO[k] || (GEO[k] = f());
function mat(c, kind){
  const k = c + '|' + (kind||'');

  let m;
  if(kind==='glass') m = new THREE.MeshStandardMaterial({color:C(c), transparent:true, opacity:.22, roughness:.08, metalness:.2, depthWrite:false});
  else if(kind==='metal') m = new THREE.MeshStandardMaterial({color:C(c), roughness:.35, metalness:.55});
  else if(kind==='glow'){ m = new THREE.MeshStandardMaterial({color:C(c), emissive:C(c), emissiveIntensity:.55, roughness:.6}); glowMats.push(m); }
  else if(kind==='soft') m = new THREE.MeshStandardMaterial({color:C(c), roughness:.95});
  else m = new THREE.MeshStandardMaterial({color:C(c), roughness:.78, metalness:0});
  return (MAT[k] = m);
}
function mk(g, c, x, y, z, kind, shadow=true){
  const m = new THREE.Mesh(g, mat(c, kind)); m.position.set(x,y,z);

}

const cyl = (rt,rb,h,seg,c,x,y,z,k) => mk(geo(`c${rt}_${rb}_${h}_${seg}`,()=>new THREE.CylinderGeometry(rt,rb,h,seg)), c,x,y,z,k);
const sph = (r,c,x,y,z,k) => mk(geo(`s${r}`,()=>new THREE.SphereGeometry(r,14,10)), c,x,y,z,k);

function rgeo(w,h,d,r){
  return geo(`r${w}_${h}_${d}_${r}`, () => {
    r = Math.min(r, w*.45, h*.45, d*.45);
    const iw = w-2*r, ih = h-2*r, cr = Math.min(iw,ih)*.15;
    const s = new THREE.Shape(), x = -iw/2, y = -ih/2;
    s.moveTo(x+cr, y); s.lineTo(x+iw-cr, y); s.quadraticCurveTo(x+iw, y, x+iw, y+cr); s.lineTo(x+iw, y+ih-cr);
    s.quadraticCurveTo(x+iw, y+ih, x+iw-cr, y+ih); s.lineTo(x+cr, y+ih); s.quadraticCurveTo(x, y+ih, x, y+ih-cr); s.lineTo(x, y+cr); s.quadraticCurveTo(x, y, x+cr, y);
    const g = new THREE.ExtrudeGeometry(s, {depth:Math.max(.001,d-2*r), bevelEnabled:true, bevelThickness:r, bevelSize:r, bevelSegments:3, curveSegments:4});
    g.center(); return g;
  });
}

const walk = (x,z) => inB(x,z) && !blocked[idx(x,z)];
function findPath(sx,sz,tx,tz){
  if(!walk(tx,tz)) return null;
  const start = idx(sx,sz), goal = idx(tx,tz);
  if(start===goal) return [];
  const gS = new Float32Array(N).fill(Infinity), came = new Int32Array(N).fill(-1), closed = new Uint8Array(N), hk = [], hv = [];
  const push = (n,f) => { hk.push(n); hv.push(f); let i = hk.length-1; while(i>0){ const p=(i-1)>>1; if(hv[p]<=hv[i]) break; [hk[p],hk[i]]=[hk[i],hk[p]]; [hv[p],hv[i]]=[hv[i],hv[p]]; i=p; } };
  const pop = () => { const top = hk[0], lk = hk.pop(), lv = hv.pop(); if(hk.length){ hk[0]=lk; hv[0]=lv; let i=0; for(;;){ const l=i*2+1, r=l+1; let m=i; if(l<hk.length&&hv[l]<hv[m]) m=l; if(r<hk.length&&hv[r]<hv[m]) m=r; if(m===i) break; [hk[m],hk[i]]=[hk[i],hk[m]]; [hv[m],hv[i]]=[hv[i],hv[m]]; i=m; } } return top; };
  const h = n => { const dx = Math.abs(n%COLS-tx), dz = Math.abs(((n/COLS)|0)-tz); return Math.max(dx,dz)+.414*Math.min(dx,dz); };
  gS[start] = 0; push(start, h(start));
  while(hk.length){
    const cur = pop(); if(cur===goal) break; if(closed[cur]) continue; closed[cur] = 1;
    const cx = cur%COLS, cz = (cur/COLS)|0;
    for(let dz=-1;dz<=1;dz++) for(let dx=-1;dx<=1;dx++){
      if(!dx && !dz) continue;
      const nx = cx+dx, nz = cz+dz; if(!walk(nx,nz)) continue;
      if(dx && dz && (!walk(cx+dx,cz) || !walk(cx,cz+dz))) continue;
      const n = idx(nx,nz); let c = (dx&&dz) ? 1.414 : 1; if(seatH[n] && n!==goal) c += 3;
      const ng = gS[cur] + c; if(ng < gS[n]){ gS[n] = ng; came[n] = cur; push(n, ng + h(n)); }
    }
  }
  if(came[goal]===-1) return null;
  const out = []; let c = goal; while(c!==start){ out.push([c%COLS+.5, ((c/COLS)|0)+.5]); c = came[c]; }
  return out.reverse();
}
function nearestWalkable(x,z,fx0,fz0){
  let best = null, bd = Infinity;
  for(let r=1;r<=2 && !best;r++) for(let dz=-r;dz<=r;dz++) for(let dx=-r;dx<=r;dx++){
    const nx = x+dx, nz = z+dz; if(!walk(nx,nz) || seatH[idx(nx,nz)]) continue;
    const d = Math.hypot(nx+.5-fx0, nz+.5-fz0); if(d < bd){ bd = d; best = [nx,nz]; }
  }
  return best;
}

  }

  for(const a of npcs){
    for(const k of NEEDS) a.needs[k] = Math.max(0, a.needs[k] - DECAY[k]*dt);
    if(a.chatT > 0){ a.chatT -= dt; a.needs.s = Math.min(100, a.needs.s + 7*dt); }
    if(a.state==='walk'){ if(stepPath(a, dt, a.act==='wander' ? 1.5 : 2.2)) arrive(a); }
    else if(a.state==='act'){
      a.moving = false; a.timer -= dt;
      if(a.act==='chat') a.needs.s = Math.min(100, a.needs.s + 9*dt);
      else if(a.spot) for(const k in a.spot.adv) a.needs[k] = Math.min(100, a.needs[k] + a.spot.adv[k]*8*dt);
      if(a.timer <= 0){ a.state = 'idle'; a.timer = rnd(.6,2.4); a.anim = ''; a.act = 'idle'; a.sit = 0; releaseSpot(a); }
    } else { a.moving = false; a.timer -= dt; if(a.timer <= 0) chooseAction(a); }
  }
}

/* ============ camera ============ */
const camera = new THREE.OrthographicCamera(-10,10,10,-10,-200,400);
const camTarget = new THREE.Vector3(0,0,.6);
const camAngle = Math.PI/4, ELEV = Math.atan2(.95,1);
let zoom = 1, viewH = 20;
function updateCam(){ const D = 40; camera.position.set(camTarget.x + Math.sin(camAngle)*D, D*.95, camTarget.z + Math.cos(camAngle)*D); camera.lookAt(camTarget); }
function resize(){
  const w = canvas.clientWidth, h = canvas.clientHeight, aspect = w/h;
  renderer.setSize(w, h, false);
  viewH = Math.max(21.5, 31/aspect);
  camera.left = -viewH*aspect/2; camera.right = viewH*aspect/2; camera.top = viewH/2; camera.bottom = -viewH/2;
  camera.zoom = zoom; camera.updateProjectionMatrix();
  if(openRoom && !fly){ const v = roomView(openRoom); camTarget.set(v.x,0,v.z); zoom = v.zoom; camera.zoom = zoom; camera.updateProjectionMatrix(); }
}
const OVERVIEW = {x:0, z:.6, zoom:1};
function roomView(r){
  const cx = wx((r.x0+r.x1+1)/2), cz = wz((r.z0+r.z1+1)/2), rw = r.x1-r.x0+1, rd = r.z1-r.z0+1;
  const vw = camera.right-camera.left, vh = camera.top-camera.bottom, mobile = canvas.clientWidth < 760;
  const pf = mobile ? 0 : Math.min(.5, 452/canvas.clientWidth), sf = mobile ? .58 : 0;
  const sw = (rw+rd)*.72, sh = (rw+rd)*.72*Math.sin(ELEV) + 1.8;
  const z = Math.max(1, Math.min(3.4, Math.min(vw*(1-pf)/sw, vh*(1-sf)/sh)*.9));
  const a = camAngle, sR = pf*vw/z/2, sD = sf*vh/z/2/Math.sin(ELEV);
  return { x: cx + Math.cos(a)*sR + Math.sin(a)*sD, z: cz - Math.sin(a)*sR + Math.cos(a)*sD, zoom: z };
}
let fly = null;
function flyTo(v){
  if(reduceMotion){ camTarget.set(v.x,0,v.z); zoom = v.zoom; camera.zoom = zoom; camera.updateProjectionMatrix(); fly = null; return; }
  fly = {t0: performance.now(), dur: 950, from:{x:camTarget.x, z:camTarget.z, zoom}, to:v};
}
const ease = t => t<.5 ? 4*t*t*t : 1 - Math.pow(-2*t+2, 3)/2;

/* ============ rooms: tags, nav, panel ============ */
const tagsEl = $('#tags'), navEl = $('#nav');
for(const r of ROOMS){
  const t = document.createElement('button'); t.className = 'tag';
  t.innerHTML = `<span class="ic" aria-hidden="true">${r.icon}</span><span></span> <small></small>`;
  t.children[1].textContent = r.name; t.children[2].textContent = r.sub;
  t.addEventListener('click', () => goRoom(r.id));
  t.addEventListener('mouseenter', () => hovered = r); t.addEventListener('mouseleave', () => { if(hovered===r) hovered = null; });
  tagsEl.appendChild(t); r.tag = t;
  const b = document.createElement('button'); b.innerHTML = `<span aria-hidden="true">${r.icon}</span>`; b.appendChild(document.createTextNode(r.name));
  b.addEventListener('click', () => goRoom(r.id)); navEl.appendChild(b); r.navBtn = b;
}
document.querySelectorAll('[data-room]').forEach(b => b.addEventListener('click', () => goRoom(b.dataset.room)));
$('#home').addEventListener('click', () => goRoom(null));
$('#back').addEventListener('click', () => goRoom(null));

let openRoom = null, hovered = null;
// la dirección guarda dónde estás: #cine (una sala) o #cine/mi-video (una publicación abierta)
function goRoom(id, itemId){
  const h = id ? '#' + id + (itemId ? '/' + encodeURIComponent(itemId) : '') : '';
  if(location.hash !== h){ try{ if(id) location.hash = h; else history.pushState(null, '', location.pathname + location.search); }catch(e){ try{ location.hash = h; }catch(_){} } }
  showRoom(id, itemId);
}
function leerHash(){ const [id, item] = location.hash.slice(1).split('/'); return [id || null, item ? decodeURIComponent(item) : null]; }
window.addEventListener('hashchange', () => showRoom(...leerHash()));
function showRoom(id, itemId){
  const r = ROOMS.find(x => x.id===id) || null;
  const yaAbierta = !!r && openRoom === r;
  openRoom = r;
  document.body.classList.toggle('room-open', !!r);
  for(const x of ROOMS) x.navBtn.setAttribute('aria-current', x===r ? 'true' : 'false');
  const panel = $('#panel');
  if(!r){ panel.hidden = true; $('#pBody').textContent = ''; flyTo(OVERVIEW); return; } // vaciar corta el video si sonaba
  $('#pIcon').textContent = r.icon; $('#pTitle').textContent = r.name; $('#pSub').textContent = r.sub;
  renderRoom(r, itemId);
  panel.hidden = false;
  if(!yaAbierta){ flyTo(roomView(r)); setTimeout(() => $('#pTitle').focus({preventScroll:true}), 50); }
}

/* ============ lo que hay en cada sala (sale de contenido.js) ============ */
const PLAY = '<svg viewBox="0 0 24 24"><path d="M6 4l14 8-14 8z"/></svg>';
const SVG = {
  mail: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3.5 6.5 8.5 6.5 8.5-6.5"/></svg>',
  linkedin: '<svg viewBox="0 0 24 24" fill="#0a66c2"><path d="M20.45 20.45h-3.55v-5.57c0-1.33-.03-3.04-1.85-3.04-1.86 0-2.14 1.45-2.14 2.94v5.67H9.36V9h3.41v1.56h.05c.48-.9 1.64-1.85 3.37-1.85 3.6 0 4.27 2.37 4.27 5.46v6.28zM5.34 7.43a2.06 2.06 0 1 1 0-4.12 2.06 2.06 0 0 1 0 4.12zM7.12 20.45H3.56V9h3.56v11.45zM22.22 0H1.77C.79 0 0 .77 0 1.73v20.54C0 23.23.79 24 1.77 24h20.45c.98 0 1.78-.77 1.78-1.73V1.73C24 .77 23.2 0 22.22 0z"/></svg>',
  bandera: '<svg viewBox="0 0 30 19" style="width:24px;height:auto;border-radius:2px;box-shadow:0 0 0 1px rgba(0,0,0,.1)"><rect width="30" height="19" fill="#74ACDF"/><rect y="6.33" width="30" height="6.34" fill="#fff"/><circle cx="15" cy="9.5" r="2.1" fill="#F6B40E" stroke="#85340A" stroke-width=".35"/></svg>'
};
const iconoYTexto = (tag, cls, svg, texto) => { const e = el(tag, cls); e.innerHTML = svg; e.appendChild(document.createTextNode(texto)); return e; };
let temaActual = null;

function renderRoom(r, itemId){
  const body = $('#pBody'); body.textContent = ''; body.scrollTop = 0;
  if(r.id==='recepcion') return renderContacto(body);

  const items = CONTENIDO.filter(c => c.tipo === r.tipo);
  const item = itemId && items.find(c => c.id === itemId);
  if(item) return renderItem(body, r, item);

  // filtro por tema (solo aparece si alguna publicación de la sala tiene "temas")
  const temas = [...new Set(items.flatMap(c => c.temas || []))];
  if(!temas.includes(temaActual)) temaActual = null;
  if(temas.length){
    const t = el('div','temas');
    for(const tema of [null, ...temas]){
      const b = el('button', null, tema || 'Todos'); b.setAttribute('aria-pressed', tema===temaActual);
      b.addEventListener('click', () => { temaActual = tema; renderRoom(r); });
      t.appendChild(b);
    }
    body.appendChild(t);
  }

  const visibles = items.filter(c => !temaActual || (c.temas || []).includes(temaActual));
  if(!visibles.length){ body.appendChild(el('p','vacio','Todavía no hay nada en esta sala.')); return; }
  for(const c of visibles){
    const b = el('button','item'), m = miniatura(c);
    const th = el('div', 'thumb' + (m ? '' : ' texto'));
    if(m) th.style.backgroundImage = `url("${m}")`; else th.textContent = ICONO[c.tipo];
    if(c.tipo==='video'){ const s = el('span','play'); s.innerHTML = PLAY; th.appendChild(s); }
    const d = el('div');
    if(c.temas && c.temas.length) d.appendChild(el('span','pill', c.temas.join(' · ')));
    d.appendChild(el('b', null, c.titulo));
    const meta = [c.tipo==='link' && c.url ? dominio(c.url) : '', formatearFecha(c.fecha)].filter(Boolean).join(' · ');
    if(meta) d.appendChild(el('div','meta', meta));
    if(c.texto) d.appendChild(el('div','resumen', c.texto.replace(/\s+/g,' ')));
    b.append(th, d);
    b.addEventListener('click', () => goRoom(r.id, c.id));
    body.appendChild(b);
  }
}

// una publicación abierta dentro del panel (la vista previa)
function renderItem(body, r, c){
  const back = iconoYTexto('button','back','<svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>', 'Todo en ' + r.name);
  back.addEventListener('click', () => goRoom(r.id));
  const art = el('article','reader');
  const media = armarMedia(c);
  if(media){
    // en las imágenes, el clic abre la página completa en otra pestaña
    if(c.tipo==='imagen'){ const a = el('a'); a.href = linkPagina(c); a.target = '_blank'; a.rel = 'noopener'; a.append(...media.childNodes); media.appendChild(a); }
    art.appendChild(media);
  }
  if(c.temas && c.temas.length) art.appendChild(el('span','pill', c.temas.join(' · ')));
  art.appendChild(el('h3', null, c.titulo));
  if(c.fecha) art.appendChild(el('p','meta', formatearFecha(c.fecha)));
  art.append(...parrafos(c.texto));
  const ac = el('div','acciones');
  if(c.tipo==='link' && c.url) ac.appendChild(botonLink(c));
  const pag = el('a','btn','Ver en pestaña nueva ↗'); pag.href = linkPagina(c); pag.target = '_blank'; pag.rel = 'noopener';
  ac.appendChild(pag);
  art.appendChild(ac);
  body.append(back, art);
}

// recepción = contacto
function renderContacto(body){
  const s = el('div','sobre'), f = el('div','foto'), t = el('div');
  f.style.backgroundImage = `url("${PERFIL.foto}")`;
  if(PERFIL.bio) t.appendChild(el('p', null, PERFIL.bio));
  s.append(f, t); body.appendChild(s);

  const lista = el('div','contacto');
  if(PERFIL.email){ const a = iconoYTexto('a','btn', SVG.mail, PERFIL.email); a.href = 'mailto:' + PERFIL.email; lista.appendChild(a); }
  if(PERFIL.linkedin){ const a = iconoYTexto('a','btn', SVG.linkedin, 'LinkedIn ↗'); a.href = PERFIL.linkedin; a.target = '_blank'; a.rel = 'noopener'; lista.appendChild(a); }
  if(PERFIL.pais) lista.appendChild(iconoYTexto('span','btn bandera', SVG.bandera, PERFIL.pais));
  body.appendChild(lista);
}

/* ============ input ============ */
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2(), gp = new THREE.Plane(new THREE.Vector3(0,1,0), 0), hp = new THREE.Vector3();
function tileAt(cx, cy){
  const r = canvas.getBoundingClientRect(); ndc.set((cx-r.left)/r.width*2-1, -((cy-r.top)/r.height)*2+1); ray.setFromCamera(ndc, camera);
  if(!ray.ray.intersectPlane(gp, hp)) return null;
  const x = Math.floor(hp.x + COLS/2), z = Math.floor(hp.z + ROWS/2); return inB(x,z) ? {x,z} : null;
}
function pan(dx, dy){
  const wpp = (camera.top-camera.bottom)/camera.zoom/canvas.clientHeight, a = camAngle, k = 1/Math.sin(ELEV);
  camTarget.x += -dx*wpp*Math.cos(a) + dy*wpp*k*(-Math.sin(a));
  camTarget.z += dx*wpp*Math.sin(a) + dy*wpp*k*(-Math.cos(a));
  camTarget.x = Math.max(-COLS/2-3, Math.min(COLS/2+3, camTarget.x)); camTarget.z = Math.max(-ROWS/2-3, Math.min(ROWS/2+5, camTarget.z));
}
const pts = new Map(); let pd = null, pinch = null;
canvas.addEventListener('pointerdown', e => {
  canvas.setPointerCapture(e.pointerId); pts.set(e.pointerId, {x:e.clientX, y:e.clientY});
  if(pts.size===2){ const [p,q] = [...pts.values()]; pinch = {d:Math.hypot(p.x-q.x,p.y-q.y), z:zoom}; pd = null; return; }
  pd = {x:e.clientX, y:e.clientY, lx:e.clientX, ly:e.clientY, moved:false};
});
canvas.addEventListener('pointermove', e => {
  if(pts.has(e.pointerId)) pts.set(e.pointerId, {x:e.clientX, y:e.clientY});
  if(pinch && pts.size===2){ const [p,q] = [...pts.values()]; zoom = Math.max(.8, Math.min(3.6, pinch.z*Math.hypot(p.x-q.x,p.y-q.y)/Math.max(1,pinch.d))); camera.zoom = zoom; camera.updateProjectionMatrix(); fly = null; return; }
  if(e.pointerType==='mouse' && !pd){ const t = tileAt(e.clientX, e.clientY); hovered = t ? roomAt(t.x,t.z) : null; canvas.style.cursor = hovered ? 'pointer' : 'grab'; }
  if(!pd) return;
  if(!pd.moved && Math.hypot(e.clientX-pd.x, e.clientY-pd.y) > 5){ pd.moved = true; fly = null; canvas.style.cursor = 'grabbing'; }
  if(pd.moved) pan(e.clientX-pd.lx, e.clientY-pd.ly);
  pd.lx = e.clientX; pd.ly = e.clientY;
});
canvas.addEventListener('pointerup', e => {
  pts.delete(e.pointerId); if(pts.size < 2) pinch = null;
  if(pd && !pd.moved){ const t = tileAt(e.clientX, e.clientY), r = t ? roomAt(t.x,t.z) : null; if(r) goRoom(r.id); else if(openRoom) goRoom(null); }
  pd = null; canvas.style.cursor = hovered ? 'pointer' : 'grab';
});
canvas.addEventListener('pointercancel', e => { pts.delete(e.pointerId); pd = null; pinch = null; });
canvas.addEventListener('pointerleave', () => { if(!pd) hovered = null; });
canvas.addEventListener('wheel', e => { e.preventDefault(); fly = null; zoom = Math.max(.8, Math.min(3.6, zoom*Math.exp(-e.deltaY*.0015))); camera.zoom = zoom; camera.updateProjectionMatrix(); }, {passive:false});
window.addEventListener('keydown', e => { if(e.key==='Escape' && openRoom) goRoom(null); });

/* ============ loop ============ */
const tv = new THREE.Vector3();
function toScreen(x, y, z){ tv.set(x,y,z).project(camera); return { x:(tv.x+1)/2*canvas.clientWidth, y:(1-tv.y)/2*canvas.clientHeight, ok: tv.z < 1 }; }
let last = performance.now(), aliveT = 0;
function frame(t){
  // tope alto: si la compu va lenta se ve entrecortado, pero no en cámara lenta
  const dt = Math.min(.25, (t-last)/1000); last = t;
  if(fly){
    const k = ease(Math.min(1, (t - fly.t0)/fly.dur));
    camTarget.x = fly.from.x + (fly.to.x-fly.from.x)*k; camTarget.z = fly.from.z + (fly.to.z-fly.from.z)*k;
    zoom = fly.from.zoom + (fly.to.zoom-fly.from.zoom)*k; camera.zoom = zoom; camera.updateProjectionMatrix();
    if(k >= 1) fly = null;
  }
  updateCam();
  const tk = night ? 1 : 0, tsec = t/1000;
  for(const n of nightLights){
    const f = n.flick ? .78 + .22*Math.sin(tsec*2.1 + n.flick)*Math.sin(tsec*.63) : 1;
    n.l.intensity = n.i * Math.max(n.day, themeK) * f;
    // una luz apagada igual se calcula en cada píxel: se saca de la escena hasta que haga falta
    const prender = n.l.intensity > .001;
    if(n.l.visible !== prender) n.l.visible = prender;
  }
  if(themeK !== tk){ themeK = tk > themeK ? Math.min(1, themeK + dt/1.4) : Math.max(0, themeK - dt/1.4); applyTheme(); }
  simNPCs(dt);
  const ts = t/1000;
  for(const a of npcs) poseAgent(a, dt, ts);
  for(const r of ROOMS){
    const target = (hovered===r && openRoom!==r) ? .14 : 0;
    r.hlo += (target - r.hlo)*Math.min(1, dt*10); r.hl.material.opacity = r.hlo; r.hl.visible = r.hlo > .003;
    const s = toScreen(wx((r.x0+r.x1+1)/2), 1.4, wz((r.z0+r.z1+1)/2));
    r.tag.style.transform = `translate(${s.x.toFixed(1)}px,${s.y.toFixed(1)}px) translate(-50%,-50%)`;
    r.tag.classList.toggle('hot', hovered===r);
  }
  for(const a of npcs){
    const b = (a.state==='act' || a.chatT>0) ? (a.chatT>0 && a.act!=='chat' ? '💬' : ACTS[a.act] || '') : '';
    if(b !== a.shown){ a.el.textContent = b; a.el.hidden = !b; a.shown = b; }
    if(b){ const s = toScreen(wx(a.x), (a.sit ? a.sit-.34 : 0) + 1.15, wz(a.z)); a.el.style.transform = `translate(${s.x.toFixed(1)}px,${s.y.toFixed(1)}px) translate(-50%,-100%)`; }
  }
  aliveT += dt;
  if(aliveT > 2){ aliveT = 0; const busy = npcs.filter(a => a.state==='act').length; $('#aliveTxt').textContent = `${npcs.length} personas dando vueltas, ${busy} ocupadas ahora mismo.`; }
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}

/* ============ boot ============ */
setNight(night); applyTheme();
if(darkMQ.addEventListener) darkMQ.addEventListener('change', e => { if(!userTheme) setNight(e.matches); });
$('#themeBtn').addEventListener('click', () => { userTheme = true; setNight(!night); });
window.addEventListener('resize', resize);
resize(); updateCam();
canvas.style.cursor = 'grab';
const [start, startItem] = leerHash();
if(start && ROOMS.some(r => r.id===start)){ showRoom(start, startItem); fly = null; const v = roomView(openRoom); camTarget.set(v.x,0,v.z); zoom = v.zoom; camera.zoom = zoom; camera.updateProjectionMatrix(); }
requestAnimationFrame(frame);
}

/* ============ arranque ============ */
// contenido.js se pide siempre fresco (?v=hora) para que lo nuevo aparezca apenas se publica
const datos = document.createElement('script');
datos.src = 'contenido.js?v=' + Date.now();
datos.onload = () => {
  document.title = PERFIL.nombre;
  const p = new URLSearchParams(location.search).get('p');
  if(p) pintarPagina(p); else iniciarOficina();
};
document.body.appendChild(datos);
</script>
